<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <a routerLink="/" class="brand-logo">
        <span class="logo-icon">🍕</span>
        <span class="brand-text">Campus Eats</span>
      </a>
    </div>

    <div class="navbar-menu">
      <a routerLink="/menu" routerLinkActive="active" class="nav-link">
        <span>Menu</span>
      </a>
      <a routerLink="/orders" routerLinkActive="active" class="nav-link">
        <span>Orders</span>
      </a>
      <a routerLink="/loyalty" routerLinkActive="active" class="nav-link">
        <span>Rewards</span>
      </a>
    </div>

    <div class="navbar-actions">
      <div class="cart-button-wrapper">
        <button 
          pButton 
          class="cart-button" 
          icon="pi pi-shopping-cart" 
          label="Cart" 
          severity="danger"
          (click)="openCart()"
        ></button>
        @if (cartService.itemCount() > 0) {
          <span class="cart-count-badge">{{ cartService.itemCount() }}</span>
        }
      </div>
      <button pButton class="login-button" icon="pi pi-user" label="Login" outlined routerLink="/login"></button>
    </div>
  </div>
</nav>

<app-cart></app-cart>
