<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <a routerLink="/" class="brand-logo">
        <span class="logo-icon">🍕</span>
        <span class="brand-text">Campus Eats</span>
      </a>
    </div>

    <div class="navbar-menu">
      <a routerLink="/menu" routerLinkActive="active" class="nav-link">
        <span>Menu</span>
      </a>
      <a routerLink="/kitchen" routerLinkActive="active" class="nav-link">
        <span>Kitchen</span>
      </a>
      <a routerLink="/loyalty" routerLinkActive="active" class="nav-link">
        <span>Rewards</span>
      </a>
    </div>

    <div class="navbar-actions">
      <div class="cart-button-wrapper">
        <button 
          pButton 
          class="cart-button" 
          icon="pi pi-shopping-cart" 
          label="Cart" 
          severity="danger"
          (click)="openCart()"
        ></button>
        @if (cartService.itemCount() > 0) {
          <span class="cart-count-badge">{{ cartService.itemCount() }}</span>
        }
      </div>

      @if (authState.isLoggedIn()) {
        <div class="user-pill" (click)="toggleUserMenu()">
          <span class="pill-greeting">Hello</span>
          <span class="pill-name">{{ authState.displayName() || 'User' }}</span>
          <i class="pi pi-chevron-down"></i>
        </div>
        @if (showUserMenu()) {
          <div class="user-menu">
            <button class="user-menu-item" routerLink="/orders" (click)="toggleUserMenu()">
              <i class="pi pi-list"></i>
              <span>My Orders</span>
            </button>
            <div class="user-menu-separator"></div>
            <button class="user-menu-item" (click)="logout()">
              <i class="pi pi-sign-out"></i>
              <span>Logout</span>
            </button>
          </div>
        }
      } @else {
        <button pButton class="login-button" icon="pi pi-user" label="Login" outlined routerLink="/login"></button>
      }
    </div>
  </div>
</nav>

<app-cart></app-cart>
