<article class="menu-item-card" [class.unavailable]="!menuItem().isAvailable" [class.adding]="isAdding()">
  <div class="card-image-container">
    <img
      [src]="menuItem().imageUrl || 'https://via.placeholder.com/400x300?text=No+Image'"
      [alt]="menuItem().name"
      class="card-image"
      loading="lazy"
    />
    @if (!menuItem().isAvailable) {
      <div class="unavailable-overlay">
        <p-tag severity="danger" value="Unavailable" styleClass="status-tag"></p-tag>
      </div>
    }
    @if (menuItem().calories) {
      <div class="calories-badge">
        <p-tag [value]="menuItem().calories + ' cal'" severity="secondary" styleClass="calories-tag"></p-tag>
      </div>
    }
  </div>

  <div class="card-content">
    <header class="item-header">
      <h3 class="item-name">{{ menuItem().name }}</h3>
      <span class="item-price">${{ menuItem().price.toFixed(2) }}</span>
    </header>

    <p class="item-description">{{ menuItem().description }}</p>

    <footer class="item-footer">
      <div class="item-meta">
        @if (menuItem().preparationTimeMinutes) {
          <span class="prep-time">
            <i class="pi pi-clock"></i>
            {{ menuItem().preparationTimeMinutes }} min
          </span>
        }
      </div>

      <button
        class="add-to-cart-btn"
        [class.added]="isAdding()"
        [disabled]="!menuItem().isAvailable"
        (click)="addToCart()"
      >
        <i [class]="isAdding() ? 'pi pi-check' : 'pi pi-shopping-cart'"></i>
        <span>{{ isAdding() ? 'Added!' : 'Add to Cart' }}</span>
      </button>
    </footer>
  </div>
</article>
