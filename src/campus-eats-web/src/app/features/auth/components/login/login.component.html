<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Log in to explore today’s dishes</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" pInputText formControlName="email" placeholder="you@example.com" />
        @if (form.get('email')?.touched && form.get('email')?.invalid) {
          <small class="error">Valid email required</small>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" pInputText formControlName="password" placeholder="••••••" />
        @if (form.get('password')?.touched && form.get('password')?.invalid) {
          <small class="error">Min 6 characters</small>
        }
      </div>

      <button pButton type="submit" label="Login" [disabled]="form.invalid || submitting" class="auth-btn"></button>

      @if (error) {
        <p class="error-banner">{{ error }}</p>
      }
    </form>

    <div class="auth-links">
      <a routerLink="/register">Create account</a>
      <a routerLink="/menu">Back to menu</a>
    </div>
  </div>
</div>
