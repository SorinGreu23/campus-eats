<p-dialog 
  [(visible)]="isVisible"
  [modal]="true" 
  [style]="{width: '90vw', maxWidth: '700px'}"
  [dismissableMask]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  [resizable]="false"
  [showHeader]="false"
  [focusOnShow]="false"
  [blockScroll]="true"
  (onHide)="onDialogHide()"
  [contentStyle]="{padding: '0', overflow: 'hidden', borderRadius: '25px'}"
  styleClass="menu-item-form-dialog"
>
  <div class="menu-item-form-content">
    <!-- Header -->
    <div class="form-header">
      <h2 class="form-title">
        <i class="pi" [class.pi-pencil]="menuItem()" [class.pi-plus-circle]="!menuItem()"></i>
        {{ menuItem() ? 'Edit Menu Item' : 'Add Menu Item' }}
      </h2>
      <button class="close-btn" type="button" (click)="onClose()">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <!-- Form -->
    <form class="menu-form" [formGroup]="form" (ngSubmit)="submitForm()">
      <div class="form-grid">
        <label>
          <span>
            <i class="pi pi-tag"></i>
            Name
          </span>
          <input formControlName="name" type="text" placeholder="e.g. Veggie Burrito" />
        </label>

        <label>
          <span>
            <i class="pi pi-folder"></i>
            Category
          </span>
          <select formControlName="categoryId">
            <option [value]="null">Select a category...</option>
            @for (cat of categories(); track cat.id) {
              <option [value]="cat.id">{{ cat.name }}</option>
            }
          </select>
        </label>

        <label>
          <span>
            <i class="pi pi-dollar"></i>
            Price
          </span>
          <input formControlName="price" type="number" min="0" step="0.01" placeholder="0.00" />
        </label>

        <label>
          <span>
            <i class="pi pi-clock"></i>
            Prep Time (min)
          </span>
          <input formControlName="preparationTimeMinutes" type="number" min="0" step="1" placeholder="15" />
        </label>

        <label>
          <span>
            <i class="pi pi-heart"></i>
            Calories
          </span>
          <input formControlName="calories" type="number" min="0" step="1" placeholder="350" />
        </label>

        <label class="checkbox">
          <input type="checkbox" formControlName="isAvailable" />
          <span>
            <i class="pi pi-check-circle"></i>
            Available
          </span>
        </label>

        <label class="full">
          <span>
            <i class="pi pi-align-left"></i>
            Description
          </span>
          <textarea formControlName="description" rows="3" placeholder="Optional description"></textarea>
        </label>
      </div>

      @if (menuError()) {
        <div class="form-error">
          <i class="pi pi-exclamation-triangle"></i>
          {{ menuError() }}
        </div>
      }

      <div class="form-actions">
        <button class="primary" type="submit" [disabled]="form.invalid || menuLoading()">
          <i class="pi" [class.pi-save]="menuItem()" [class.pi-plus]="!menuItem()"></i>
          {{ menuItem() ? 'Save Changes' : 'Add Item' }}
        </button>
        <button class="ghost" type="button" (click)="onClose()">
          <i class="pi pi-times"></i>
          Cancel
        </button>
      </div>
    </form>
  </div>
</p-dialog>
